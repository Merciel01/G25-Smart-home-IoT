# Exemple de configuration serveur ; chemins à adapter sur l'hôte du broker.
listener 8883
protocol mqtt
allow_anonymous false
cafile /etc/mosquitto/tls/ca.crt
certfile /etc/mosquitto/tls/server.crt
keyfile /etc/mosquitto/tls/server.key
tls_version tlsv1.2
password_file /etc/mosquitto/passwords
acl_file /etc/mosquitto/g25.acl
persistence true
persistence_location /var/lib/mosquitto/
max_packet_size 8192
